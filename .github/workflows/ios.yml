name: iOS unsigned ipa

# 手动触发：Actions 页面点 "Run workflow" 即出包。
# 产物为未签名 .ipa（TrollStore 直接安装，或用 Sideloadly/自签工具重签）。
# 思路：不调用 `tauri ios build`（它需要签名凭证），而是
#   1) 先 cargo 编出 aarch64-apple-ios 的静态库，放到工程期望的 Externals/arm64/release/
#   2) 把 Xcode 工程里 "Build Rust Code" 脚本阶段替换成 echo，避免 tauri-cli 的 xcode-script 读不到 dev 地址文件而 panic
#   3) xcodebuild 不签名构建，取出 .app 打包成 Payload/HGhub.app -> ipa
on:
  workflow_dispatch:

env:
  CI: "true"

jobs:
  ios:
    name: iOS (unsigned ipa, arm64)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios

      - name: 安装 xcodegen
        run: brew install xcodegen

      - run: pnpm install --frozen-lockfile

      - name: 前端产物
        run: |
          set -euo pipefail
          pnpm build
          du -sh dist
          ls dist | head

      - name: 生成 iOS 工程
        env:
          APPLE_DEVELOPMENT_TEAM: ABCDE12345
        run: pnpm tauri ios init --ci

      - name: 编译 Rust 静态库（arm64, release）
        run: |
          set -euo pipefail
          cd src-tauri
          # 必须带 custom-protocol，否则编出来的是 dev 模式（会去连 localhost:1420）
          cargo build --target aarch64-apple-ios --release --lib --features tauri/custom-protocol
          mkdir -p gen/apple/Externals/arm64/release
          cp target/aarch64-apple-ios/release/libhuangguo_client_lib.a gen/apple/Externals/arm64/release/
          # 工程模板里的链接项是 -lapp（正常由 `tauri ios build` 改写），这里直接补一份同名库
          cp target/aarch64-apple-ios/release/libhuangguo_client_lib.a gen/apple/Externals/arm64/release/libapp.a
          ls -lh gen/apple/Externals/arm64/release/

      - name: 屏蔽 Xcode 的 Build Rust Code 脚本阶段
        run: |
          set -euo pipefail
          cd src-tauri/gen/apple
          PROJ="$(ls -d *.xcodeproj | head -1)"
          python3 - "$PROJ/project.pbxproj" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          # 找到含 tauri ios xcode-script 的 shellScript 值并整体替换为 echo
          pat = re.compile(r'shellScript = ("(?:[^"\\]|\\.)*");')
          def repl(m):
              return 'shellScript = "echo \\"skip rust build (prebuilt static lib)\\"";' if 'tauri ios xcode-script' in m.group(1) else m.group(0)
          s2, n = pat.subn(repl, s)
          open(p, 'w', encoding='utf-8').write(s2)
          print("patched shell scripts:", n)
          assert 'tauri ios xcode-script' not in open(p, encoding='utf-8').read(), "script phase not neutralized"
          PY

      - name: xcodebuild（不签名）
        run: |
          set -euo pipefail
          cd src-tauri/gen/apple
          PROJ="$(ls -d *.xcodeproj | head -1)"
          xcodebuild -project "$PROJ" -list
          SCHEME="$(xcodebuild -project "$PROJ" -list -json \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d["project"]["schemes"][0])')"
          echo "PROJ=$PROJ SCHEME=$SCHEME"

          # Rust 静态库里带 Tauri 的 Swift 桥接对象，最终链接需要 Swift 兼容库
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          TC="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphoneos"
          echo "SDK=$SDK"; echo "TC=$TC"
          ls "$TC" 2>/dev/null | head -20 || true
          ls "$SDK/usr/lib/swift" 2>/dev/null | head -20 || true
          EXTRA=""
          for d in "$TC" "$SDK/usr/lib/swift/iphoneos" "$SDK/usr/lib/swift"; do
            if [ -f "$d/libswiftCompatibility56.a" ]; then
              EXTRA="$EXTRA -L$d -lswiftCompatibility56"
            fi
            if [ -f "$d/libswiftCompatibilityConcurrency.a" ]; then
              EXTRA="$EXTRA -L$d -lswiftCompatibilityConcurrency"
            fi
          done
          echo "EXTRA=$EXTRA"

          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            OTHER_LDFLAGS="$EXTRA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY=""

      - name: 打包成 ipa
        run: |
          set -euo pipefail
          cd src-tauri/gen/apple
          APP="$(find build/Build/Products -maxdepth 2 -name '*.app' | head -1)"
          if [ -z "$APP" ]; then echo "::error::没找到 .app"; exit 1; fi
          echo "APP=$APP"
          ls -lh "$APP/"
          V="$(node -p "require('./../../../package.json').version")"
          OUT="$RUNNER_TEMP/Payload"
          mkdir -p "$OUT"
          cp -R "$APP" "$OUT/"
          cd "$RUNNER_TEMP"
          zip -qry "HGhub_${V}_ios_unsigned.ipa" Payload
          unzip -l "HGhub_${V}_ios_unsigned.ipa" | head -20
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          mv "HGhub_${V}_ios_unsigned.ipa" "$GITHUB_WORKSPACE/artifacts/"
          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: artifacts/*.ipa
          if-no-files-found: error
